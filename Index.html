<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Deluxe Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="main-wrapper">
        <div id="game-console">
            <div class="top-bar">
                <div class="stats-group">
                    <div class="stat-box"><i class="fas fa-coins text-gold"></i> <span id="coin-count">40</span></div>
                    <div class="stat-box"><i class="fas fa-star text-blue"></i> <span id="xp-count">XP 0</span></div>
                </div>
                <div class="icon-group">
                    <button class="icon-btn" onclick="toggleOverlay('leaderboard-overlay')"><i class="fas fa-chart-bar"></i></button>
                    <button class="icon-btn" onclick="toggleOverlay('settings-overlay')"><i class="fas fa-cog"></i></button>
                </div>
            </div>

            <div class="content-area">
                <div id="main-menu" class="scene">
                    <div class="logo-container">
                        <div class="logo-orb">
                            <i class="fas fa-times"></i>
                            <i class="far fa-circle"></i>
                        </div>
                        <h1>TIC TAC TOE</h1>
                        <p class="subtitle">PREMIUM EDITION</p>
                    </div>
                    <div class="menu-actions">
                        <button class="btn btn-primary" onclick="prepareGame(true)"><i class="fas fa-robot"></i> VS COMPUTER</button>
                        <button class="btn btn-secondary" onclick="prepareGame(false)"><i class="fas fa-users"></i> MULTIPLAYER</button>
                    </div>
                </div>

                <div id="setup-menu" class="scene hide">
                    <h2 class="scene-title">GAME SETUP</h2>
                    <div class="setup-grid">
                        <div class="setup-card">
                            <span>UKURAN PAPAN</span>
                            <div class="option-group">
                                <button class="size-opt active" data-size="3">3 x 3</button>
                                <button class="size-opt" data-size="4">4 x 4</button>
                            </div>
                        </div>
                        <div class="setup-card">
                            <span>SIMBOL KAMU</span>
                            <div class="option-group">
                                <button id="pickX" class="mode-opt active" onclick="pickSymbol('X')">X</button>
                                <button id="pickO" class="mode-opt" onclick="pickSymbol('O')">O</button>
                            </div>
                        </div>
                        <button id="start-game-btn" class="btn btn-play">START BATTLE</button>
                        <button class="back-link" onclick="showScene('main-menu')">BACK TO MENU</button>
                    </div>
                </div>

                <div id="game-scene" class="scene hide">
                    <div class="game-header">
                        <button class="icon-btn" onclick="showScene('main-menu')"><i class="fas fa-chevron-left"></i></button>
                        <div class="round-indicator" id="turn-info">PLAYER X TURN</div>
                        <button class="icon-btn" onclick="resetGame()"><i class="fas fa-redo-alt"></i></button>
                    </div>
                    
                    <div class="game-layout">
                        <div class="player-panel" id="panel-L">
                            <div class="avatar-wrap"><div class="avatar">L</div></div>
                            <h4>LUCAS (CPU)</h4>
                            <span class="score-tag"><i class="fas fa-trophy"></i> <span id="score-lucas">0</span></span>
                        </div>
                        
                        <div id="game-board" class="game-board"></div>

                        <div class="player-panel" id="panel-P">
                            <div class="avatar-wrap"><div class="avatar">P</div></div>
                            <h4 id="user-display">PLAYER</h4>
                            <span class="score-tag"><i class="fas fa-trophy"></i> <span id="score-player">0</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="win-overlay" class="overlay hide">
                <div class="win-card">
                    <i class="fas fa-crown crown-icon"></i>
                    <h1 id="win-text">YOU WIN!</h1>
                    <button class="btn btn-primary" onclick="resetGame()">PLAY AGAIN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-overlay" class="overlay hide">
        <div class="modal-card">
            <h3>PENGATURAN</h3>
            <button class="btn btn-secondary" onclick="resetAllData()" style="background: #ef4444; color: white;">RESET SEMUA SKOR</button>
            <button class="btn btn-secondary" onclick="toggleOverlay('settings-overlay')">TUTUP</button>
        </div>
    </div>

    <div id="leaderboard-overlay" class="overlay hide">
        <div class="modal-card">
            <h3>LEADERBOARD</h3>
            <p>Lucas: <span id="lb-lucas">0</span></p>
            <p>Player: <span id="lb-player">0</span></p>
            <button class="btn btn-primary" onclick="toggleOverlay('leaderboard-overlay')">TUTUP</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
